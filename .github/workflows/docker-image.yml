name: Build Image & Push To Aliyun ACR

on:
  push:
    branches: [ "master" ]
env:
  # GitOps仓库信息
  GITOPS_REPO: "nmgkds/argoTest"
  GITOPS_APP_PATH: "k8s" # RepoB内应用yaml目录

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set variables
      run: |
        # 1. 定义 Shell 变量
        SHORT_SHA=${GITHUB_SHA:0:7}
        BRANCH=${{ github.ref_name }}
        
        # 2. 使用 Shell 变量进行拼接
        IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
        # 注意：如果 ACR_REGISTRY 等是仓库设置的 Secrets，这里需要换成 ${{ secrets.ACR_REGISTRY }}
        FULL_IMAGE="${{ secrets.ALI_REGISTRY }}/${{ secrets.ALI_NAMESPACE }}/${{ secrets.ALI_REPOSITORY }}:${IMAGE_TAG}"
        
        # 3. 打印验证（使用 Shell 变量）
        echo "The short SHA is: $SHORT_SHA"
        echo "The full image is: $FULL_IMAGE"
        
        # 4. 统一写入 $GITHUB_ENV，供后续 Step 使用
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

    - name: Login to Aliyun ACR
      uses: docker/login-action@v3
      with:
          registry: ${{ secrets.ALI_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
     
      # run: |
      #     docker login \
      #     --username=${{ secrets.ACR_USERNAME }} \
      #     crpi-vyt22uhlh2w61g5u.cn-shanghai.personal.cr.aliyuncs.com \
      #     --password=${{ secrets.ACR_PASSWORD }}

    - name: Generate image meta
      id: meta
      run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "IMAGE_FULL=${{ secrets.ALI_REGISTRY }}/${{ secrets.ALI_NAMESPACE }}/${{ secrets.ALI_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_ENV
    
    - name: Build & Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.FULL_IMAGE }}

    
    # - name: Build & Push Docker Image
    #   uses: docker/build-push-action@v5
    #   with:
    #       context: .
    #       push: true
    #       # 如果你的Dockerfile不在根目录 ，添加 file: ./app/Dockerfile
    #       tags: |
    #         ${{ env.IMAGE_FULL }}
    #         ${{ secrets.ALI_REGISTRY }}/${{ secrets.ALI_NAMESPACE }}/${{ secrets.ALI_REPOSITORY }}:latest
    #       # ACK集群一般amd64，若需要arm架构自行修改
    #       platforms: linux/amd64
    #       # cache-from: type=registry,reference=${{ env.IMAGE_FULL }}
    #       # cache-to: type=registry,reference=${{ env.IMAGE_FULL }},mode=max


    # 7. 打印最终镜像地址，方便复制到ACK deployment
    - name: Output final image address
      run: |
          echo "✅ 镜像构建推送完成"
          echo "镜像地址：${{ env.FULL_IMAGE }}"

    - name: Checkout GitOps RepoB
      uses: actions/checkout@v4
      with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo # 克隆到子目录，不和源码冲突

    - name: Install yq (yaml编辑工具)
      run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

    - name: Update image in deployment.yaml
      run: |
          cd gitops-repo
          # 修改deployment中容器镜像路径，根据你的yaml层级调整路径！
          yq eval ".spec.template.spec.containers[0].image = \"${{ env.FULL_IMAGE }}\"" \
            ${{ env.GITOPS_APP_PATH }}/deployment.yaml \
            --inplace
    - name: Commit & Push changes to GitOps Repo
      run: |
          cd gitops-repo
          git config --global user.name "github-action-bot"
          git config --global user.email "bot@github.com"
          git add ${{ env.GITOPS_APP_PATH }}/deployment.yaml
          # 判断是否有变更，无变更直接退出不提交
          if git diff --cached --quiet; then
            echo "No image changes, skip commit"
          else
            git commit -m "auto update image to ${{ env.FULL_IMAGE }}
            commit source: ${{ github.sha }} repoA"
            git push
          fi
      
